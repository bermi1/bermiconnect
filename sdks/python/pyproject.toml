[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bermi_connect"
version = "1.0.0"
description = "Official Python SDK for the Bermi Connect bulk SMS API (Tanzania). Zero dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Bermi Techs", email = "support@bermiconnect.co.tz" }]
keywords = ["sms", "bulk-sms", "tanzania", "otp", "bermi"]
dependencies = []

[project.urls]
Documentation = "https://docs.bermiconnect.co.tz"

[tool.setuptools]
packages = ["bermi_connect"]
